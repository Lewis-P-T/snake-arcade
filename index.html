<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Snake Arcade</h1>
  <div id="hud">Score: <span id="score">0</span> · Level <span id="level">1</span> · <span id="mode"></span> <span id="effects"></span></div>
  <div id="stage">
    <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
    <div id="overlay" role="dialog" aria-live="polite"></div>
  </div>
  <p id="msg">Arrow keys / WASD to move · P / Esc to pause · H high scores · D demo (BFS autopilot)<br>Touch: swipe to steer, tap to pause<br>Level up every 5 food · Power-ups: <b>S</b> slow-mo, <b>2</b> score ×2, <b>-</b> shrink</p>
</main>
<script src="game.js"></script>
<script src="script.js"></script>
</body>
</html>
